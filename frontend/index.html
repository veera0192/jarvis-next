<script>

/* =========================================================
   JARVIS — STABLE CONTROL ENGINE
   ========================================================= */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw4dMC6apEsfbuAC1YtQqmXL2yvYYMYHuV8w8pP3Hber4L4EStbEwex926EGYy0GbM/exec";


let selectedModel = "";
let recognition = null;
let isListening = false;
let jarvisVoices = [];
let messageCounter = 0;


/* =========================================================
   SAFE ELEMENT HELPER
   ========================================================= */

function $(id){
    return document.getElementById(id);
}


/* =========================================================
   STATUS
   ========================================================= */

function updateStatus(text){

    const status = $("systemStatus");
    const state = $("coreState");

    if(status){
        status.textContent = text;
    }

    if(state){
        state.textContent = text;
    }
}


/* =========================================================
   CHAT
   ========================================================= */

function addMessage(text, sender){

    if(!text) return;

    const chat = $("chat");

    if(!chat) return;

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " + sender;


    const label =
        document.createElement("div");

    label.className =
        "message-label";

    label.textContent =
        sender === "user"
        ? "YOU"
        : "JARVIS";


    const content =
        document.createElement("div");

    content.className =
        "message-text";

    content.textContent =
        text;


    wrapper.appendChild(label);
    wrapper.appendChild(content);

    chat.appendChild(wrapper);


    messageCounter++;


    const count = $("chatCount");

    if(count){
        count.textContent =
            messageCounter + " MESSAGES";
    }


    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   VOICE
   ========================================================= */

function loadVoices(){

    try{

        jarvisVoices =
            window.speechSynthesis
            ? speechSynthesis.getVoices()
            : [];

    }catch(error){

        console.log(
            "Voice loading error",
            error
        );

    }
}


if("speechSynthesis" in window){

    speechSynthesis.onvoiceschanged =
        loadVoices;

    loadVoices();
}


/* =========================================================
   SELECT VOICE
   ========================================================= */

function getBestVoice(){

    const voices =
        jarvisVoices.length
        ? jarvisVoices
        : (
            "speechSynthesis" in window
            ? speechSynthesis.getVoices()
            : []
        );


    let voice =
        voices.find(v =>
            v.lang &&
            v.lang.toLowerCase() === "te-in"
        );


    if(!voice){

        voice =
            voices.find(v =>
                v.lang &&
                v.lang.toLowerCase() === "en-in"
            );

    }


    if(!voice){

        voice =
            voices.find(v =>
                v.lang &&
                v.lang.toLowerCase()
                .startsWith("en")
            );

    }


    return voice || voices[0] || null;
}


/* =========================================================
   NATURAL SPEAK
   ========================================================= */

function speakNatural(text){

    if(
        !text ||
        !("speechSynthesis" in window)
    ){

        return;

    }


    try{

        speechSynthesis.cancel();


        let cleanText =
            String(text)
            .replace(/[*#_~`]/g,"")
            .replace(/\s+/g," ")
            .trim();


        if(!cleanText) return;


        const voice =
            getBestVoice();


        const utterance =
            new SpeechSynthesisUtterance(
                cleanText
            );


        if(voice){

            utterance.voice =
                voice;

            utterance.lang =
                voice.lang;

        }else{

            utterance.lang =
                "en-IN";

        }


        utterance.rate =
            0.93;

        utterance.pitch =
            1.05;

        utterance.volume =
            1;


        utterance.onstart =
            function(){

                updateStatus(
                    "SPEAKING"
                );

            };


        utterance.onend =
            function(){

                updateStatus(
                    "READY"
                );

            };


        utterance.onerror =
            function(){

                updateStatus(
                    "READY"
                );

            };


        speechSynthesis.speak(
            utterance
        );

    }catch(error){

        console.log(
            "Speech error:",
            error
        );

        updateStatus(
            "READY"
        );

    }
}


/* =========================================================
   STOP VOICE
   ========================================================= */

function stopJarvisVoice(){

    try{

        if(
            "speechSynthesis" in window
        ){

            speechSynthesis.cancel();

        }

    }catch(error){

        console.log(error);

    }

    updateStatus("READY");
}


/* =========================================================
   MEMORY
   ========================================================= */

function getMemory(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "jarvis_memory"
            ) || "[]"
        );

    }catch(error){

        return [];

    }
}


function saveMemory(text){

    if(!text) return;


    const memories =
        getMemory();


    memories.push({

        text:text,

        time:
            new Date().toLocaleString()

    });


    localStorage.setItem(
        "jarvis_memory",
        JSON.stringify(memories)
    );


    renderMemory();
}


function renderMemory(){

    const list =
        $("memoryList");

    if(!list) return;


    const memories =
        getMemory();


    list.innerHTML = "";


    if(!memories.length){

        list.innerHTML =
            `<div class="memory-item">
                Memory empty.
             </div>`;

        return;

    }


    memories
    .slice()
    .reverse()
    .forEach(function(memory){

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "memory-item";

        item.textContent =
            "🧠 " + memory.text;

        list.appendChild(item);

    });
}


function clearMemory(){

    localStorage.removeItem(
        "jarvis_memory"
    );

    renderMemory();


    const message =
        "సరే… నా memory క్లియర్ చేశాను.";

    addMessage(
        message,
        "jarvis"
    );

    speakNatural(message);
}


/* =========================================================
   MEMORY COMMAND
   ========================================================= */

function handleMemoryCommand(text){

    const lower =
        text.toLowerCase();


    if(
        lower.includes("గుర్తుంచుకో") ||
        lower.includes("remember")
    ){

        saveMemory(text);

        return "సరే వీరా… ఇది గుర్తుంచుకున్నాను.";

    }


    if(
        lower.includes("నా పేరు ఏంటి") ||
        lower.includes("నా పేరు ఏమిటి") ||
        lower.includes("what is my name")
    ){

        const memories =
            getMemory();


        const found =
            memories.find(function(item){

                return item.text.includes(
                    "నా పేరు"
                );

            });


        if(found){

            return found.text;

        }


        return "ఇంకా నీ పేరు నా memoryలో లేదు.";

    }


    if(
        lower.includes("మెమరీ క్లియర్") ||
        lower.includes("memory clear") ||
        lower.includes("clear memory")
    ){

        localStorage.removeItem(
            "jarvis_memory"
        );

        renderMemory();

        return "సరే… memory క్లియర్ చేశాను.";

    }


    return null;
}


/* =========================================================
   LOCAL COMMANDS
   ========================================================= */

function handleLocalCommand(text){

    const lower =
        text.toLowerCase();


    if(
        lower.includes("youtube") &&
        (
            lower.includes("open") ||
            lower.includes("ఓపెన్") ||
            lower.includes("తెరువు")
        )
    ){

        window.open(
            "https://www.youtube.com/",
            "_blank"
        );

        return "సరే వీరా… YouTube ఓపెన్ చేస్తున్నాను.";

    }


    if(
        lower.includes("instagram") &&
        (
            lower.includes("open") ||
            lower.includes("ఓపెన్") ||
            lower.includes("తెరువు")
        )
    ){

        window.open(
            "https://www.instagram.com/",
            "_blank"
        );

        return "సరే వీరా… Instagram ఓపెన్ చేస్తున్నాను.";

    }


    return null;
}


/* =========================================================
   SEND
   ========================================================= */

async function sendMessage(){

    const input =
        $("messageInput");

    if(!input) return;


    const text =
        input.value.trim();


    if(!text){

        input.focus();

        return;

    }


    input.value = "";


    addMessage(
        text,
        "user"
    );


    /* MEMORY */

    const memoryReply =
        handleMemoryCommand(
            text
        );


    if(memoryReply){

        addMessage(
            memoryReply,
            "jarvis"
        );

        speakNatural(
            memoryReply
        );

        return;
    }


    /* LOCAL COMMAND */

    const localReply =
        handleLocalCommand(
            text
        );


    if(localReply){

        addMessage(
            localReply,
            "jarvis"
        );

        speakNatural(
            localReply
        );

        return;
    }


    /* GEMINI */

    await askGemini(text);
}


/* =========================================================
   GEMINI
   ========================================================= */

async function askGemini(text){

    updateStatus(
        "THINKING"
    );


    try{

        const memories =
            getMemory();


        const memoryText =
            memories
            .map(function(item){
                return item.text;
            })
            .join("\n");


        const systemPrompt = `
You are JARVIS, a friendly Indian female AI assistant.

Speak naturally like a real Indian girl talking to a friend.

Use simple Telugu mixed with English.

Be warm, short and conversational.

Do not sound robotic.

Use natural phrases such as:

"సరే వీరా…"
"ఓకే…"
"అవును."
"చేస్తున్నాను."
"అయిపోయింది."

Do not repeat the user's complete question.

Keep simple answers short.

User memory:
${memoryText || "No saved memory."}
`;


        const response =
            await fetch(
                APPS_SCRIPT_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify({

                            model:
                                selectedModel,

                            system:
                                systemPrompt,

                            message:
                                text

                        })
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.error ||
                "Gemini failed"
            );

        }


        const reply =
            data.reply ||
            "క్షమించండి… response రాలేదు.";


        updateStatus(
            "READY"
        );


        addMessage(
            reply,
            "jarvis"
        );


        speakNatural(
            reply
        );


    }catch(error){

        console.error(
            "GEMINI ERROR:",
            error
        );


        const errorMessage =
            "వీరా… AI connectionలో సమస్య వచ్చింది.";


        updateStatus(
            "ERROR"
        );


        addMessage(
            errorMessage,
            "jarvis"
        );


        speakNatural(
            errorMessage
        );


        setTimeout(
            function(){
                updateStatus("READY");
            },
            2000
        );

    }
}


/* =========================================================
   LOAD MODELS
   ========================================================= */

async function loadModels(){

    const select =
        $("modelSelect");

    if(!select) return;


    try{

        select.innerHTML =
            `<option>
                Loading...
             </option>`;


        const response =
            await fetch(
                APPS_SCRIPT_URL
            );


        const data =
            await response.json();


        select.innerHTML = "";


        if(
            data.models &&
            data.models.length
        ){

            data.models.forEach(
                function(model){

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        model;

                    option.textContent =
                        model;

                    select.appendChild(
                        option
                    );

                }
            );


            selectedModel =
                data.defaultModel ||
                data.models[0];


            select.value =
                selectedModel;

        }else{

            select.innerHTML =
                `<option value="">
                    Server Default
                 </option>`;

        }


    }catch(error){

        console.error(
            "MODEL ERROR:",
            error
        );


        select.innerHTML =
            `<option value="">
                Server Default
             </option>`;

    }


    select.onchange =
        function(){

            selectedModel =
                select.value;

        };
}


/* =========================================================
   MICROPHONE
   ========================================================= */

function setupMicrophone(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        console.log(
            "Speech recognition unavailable"
        );

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "te-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function(){

            isListening =
                true;


            const button =
                $("micButton");


            if(button){

                button.classList.add(
                    "listening"
                );

                button.textContent =
                    "🔴";

            }


            updateStatus(
                "LISTENING"
            );

        };


    recognition.onresult =
        function(event){

            const result =
                event.results[0][0]
                .transcript;


            const input =
                $("messageInput");


            if(input){

                input.value =
                    result;

            }


            stopListeningUI();


            setTimeout(
                sendMessage,
                200
            );

        };


    recognition.onerror =
        function(event){

            console.log(
                "MIC ERROR:",
                event.error
            );


            stopListeningUI();

        };


    recognition.onend =
        function(){

            stopListeningUI();

        };
}


function stopListeningUI(){

    isListening =
        false;


    const button =
        $("micButton");


    if(button){

        button.classList.remove(
            "listening"
        );

        button.textContent =
            "🎙️";

    }


    updateStatus(
        "READY"
    );
}


function toggleMic(){

    if(!recognition){

        setupMicrophone();

    }


    if(!recognition){

        const msg =
            "ఈ browserలో microphone voice recognition support లేదు.";

        addMessage(
            msg,
            "jarvis"
        );

        speakNatural(msg);

        return;

    }


    if(isListening){

        try{

            recognition.stop();

        }catch(error){

            console.log(error);

        }

        return;

    }


    stopJarvisVoice();


    try{

        recognition.start();

    }catch(error){

        console.log(
            "START MIC ERROR:",
            error
        );

    }
}


/* =========================================================
   QUICK COMMANDS
   ========================================================= */

function quickCommand(command){

    const input =
        $("messageInput");


    if(!input) return;


    input.value =
        command;


    sendMessage();
}
